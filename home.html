<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☸ Zen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap');

  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: rgba(255,255,255,0.04);
    --bg-card-hover: rgba(255,255,255,0.08);
    --text-primary: #e8e8ed;
    --text-secondary: #6b6b80;
    --text-dim: #3a3a4a;
    --accent: #7c6aef;
    --accent-glow: rgba(124,106,239,0.25);
    --accent-secondary: #4ecdc4;
    --border: rgba(255,255,255,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated gradient orbs */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  .bg-orb-1 {
    width: 600px; height: 600px;
    background: var(--accent);
    top: -200px; left: -100px;
    animation: orbFloat1 25s ease-in-out infinite;
  }
  .bg-orb-2 {
    width: 500px; height: 500px;
    background: var(--accent-secondary);
    bottom: -150px; right: -100px;
    animation: orbFloat2 30s ease-in-out infinite;
  }
  .bg-orb-3 {
    width: 350px; height: 350px;
    background: #e040a0;
    top: 50%; left: 60%;
    animation: orbFloat3 20s ease-in-out infinite;
  }

  @keyframes orbFloat1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(80px, 60px) scale(1.1); }
    66% { transform: translate(-40px, 30px) scale(0.95); }
  }
  @keyframes orbFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-60px, -80px) scale(1.05); }
    66% { transform: translate(50px, -40px) scale(0.9); }
  }
  @keyframes orbFloat3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-60px, 40px) scale(1.15); }
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 24px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Clock & Greeting ── */
  .clock-section {
    text-align: center;
    padding: 40px 0 20px;
  }

  .greeting {
    font-size: 1.25rem;
    font-weight: 300;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    margin-bottom: 8px;
    transition: color 0.5s;
  }

  .time-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 5.5rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .date-display {
    font-size: 1.05rem;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: 10px;
    letter-spacing: 0.02em;
  }

  .quote {
    margin-top: 24px;
    font-size: 0.95rem;
    color: var(--text-dim);
    font-style: italic;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }

  /* ── Search ── */
  .search-section {
    margin: 36px 0;
  }

  .search-wrapper {
    position: relative;
    max-width: 600px;
    margin: 0 auto;
  }

  .search-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 18px 20px 18px 52px;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text-primary);
    outline: none;
    transition: all 0.3s ease;
    backdrop-filter: blur(12px);
  }

  .search-input::placeholder {
    color: var(--text-dim);
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow);
    background: var(--bg-card-hover);
  }

  .engine-pills {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }

  .engine-pill {
    padding: 6px 14px;
    font-size: 0.78rem;
    font-weight: 500;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .engine-pill:hover {
    background: var(--bg-card);
    color: var(--text-primary);
  }

  .engine-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── Quick Links ── */
  .links-section {
    flex: 1;
    margin-top: 20px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .section-title {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .btn-add {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .btn-add:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
    border-color: var(--accent);
  }

  .links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
  }

  .link-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 24px 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
    position: relative;
    overflow: hidden;
  }

  .link-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-glow), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .link-card:hover {
    transform: translateY(-3px);
    border-color: rgba(124,106,239,0.3);
    box-shadow: var(--shadow);
  }

  .link-card:hover::before { opacity: 1; }

  .link-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    position: relative;
    z-index: 1;
  }

  .link-name {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-primary);
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .link-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: none;
    background: rgba(255,60,60,0.15);
    color: #ff5555;
    font-size: 0.75rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: background 0.2s;
  }

  .link-delete:hover { background: rgba(255,60,60,0.3); }

  .link-card:hover .link-delete { display: flex; }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    width: 90%;
    max-width: 420px;
    box-shadow: var(--shadow);
  }

  .modal h3 {
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 20px;
  }

  .modal input {
    width: 100%;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
  }

  .modal input:focus {
    border-color: var(--accent);
  }

  .modal-buttons {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 8px;
  }

  .modal-btn {
    padding: 10px 22px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .modal-btn.cancel {
    background: transparent;
    color: var(--text-secondary);
  }

  .modal-btn.cancel:hover {
    background: var(--bg-card);
  }

  .modal-btn.confirm {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .modal-btn.confirm:hover {
    opacity: 0.9;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 24px 0 12px;
    color: var(--text-dim);
    font-size: 0.75rem;
    letter-spacing: 0.03em;
  }

  .footer a {
    color: var(--text-secondary);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s;
  }

  .footer a:hover {
    color: var(--accent);
  }

  /* ── Settings Panel ── */
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .settings-row:last-child { border-bottom: none; }

  .settings-label {
    font-size: 0.92rem;
    font-weight: 400;
    color: var(--text-primary);
  }

  .settings-desc {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Toggle switch */
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    left: 2px;
    top: 2px;
    background: var(--text-secondary);
    border-radius: 50%;
    transition: all 0.3s;
  }

  .toggle input:checked + .toggle-slider {
    background: var(--accent);
    border-color: var(--accent);
  }

  .toggle input:checked + .toggle-slider::before {
    transform: translateX(20px);
    background: #fff;
  }

  /* Reset button */
  .btn-reset {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,60,60,0.2);
    background: rgba(255,60,60,0.08);
    color: #ff6b6b;
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-reset:hover {
    background: rgba(255,60,60,0.15);
    border-color: rgba(255,60,60,0.4);
  }

  /* Accent color picker */
  .color-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .color-swatch {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
  }

  .color-swatch:hover { transform: scale(1.15); }

  .color-swatch.active {
    border-color: #fff;
    box-shadow: 0 0 0 2px var(--accent-glow);
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .time-display { font-size: 3.5rem; }
    .links-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="container">

  <!-- Clock & Greeting -->
  <div class="clock-section">
    <div class="greeting" id="greeting"></div>
    <div class="time-display" id="clock"></div>
    <div class="date-display" id="date"></div>
    <div class="quote" id="quote"></div>
  </div>

  <!-- Search -->
  <div class="search-section">
    <div class="search-wrapper">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search the web…" autocomplete="off" />
    </div>
    <div class="engine-pills" id="enginePills">
      <button class="engine-pill active" data-engine="google">Google</button>
      <button class="engine-pill" data-engine="duckduckgo">DuckDuckGo</button>
      <button class="engine-pill" data-engine="bing">Bing</button>
      <button class="engine-pill" data-engine="brave">Brave</button>
      <button class="engine-pill" data-engine="youtube">YouTube</button>
    </div>
  </div>

  <!-- Quick Links -->
  <div class="links-section">
    <div class="section-header">
      <span class="section-title">Quick Links</span>
      <button class="btn-add" id="btnAdd" title="Add link">+</button>
    </div>
    <div class="links-grid" id="linksGrid"></div>
  </div>

  <div class="footer">Zen Homepage &middot; Stay focused &middot; <a id="btnCustomize">Customize</a></div>
</div>

<!-- Add Link Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Add Quick Link</h3>
    <input type="text" id="modalName" placeholder="Name (e.g. GitHub)" />
    <input type="text" id="modalUrl" placeholder="URL (e.g. https://github.com)" />
    <input type="text" id="modalEmoji" placeholder="Emoji icon (e.g. 🐙)" />
    <div class="modal-buttons">
      <button class="modal-btn cancel" id="modalCancel">Cancel</button>
      <button class="modal-btn confirm" id="modalConfirm">Add</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h3>⚙ Customize Homepage</h3>

    <div class="settings-row">
      <div>
        <div class="settings-label">Show Clock</div>
        <div class="settings-desc">Display time and date</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggleClock" checked />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="settings-row">
      <div>
        <div class="settings-label">Show Quote</div>
        <div class="settings-desc">Daily inspiration</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggleQuote" checked />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="settings-row">
      <div>
        <div class="settings-label">Show Search</div>
        <div class="settings-desc">Search bar and engines</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggleSearch" checked />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="settings-row">
      <div>
        <div class="settings-label">Accent Color</div>
        <div class="settings-desc">Pick your vibe</div>
      </div>
      <div class="color-options" id="colorOptions">
        <div class="color-swatch active" data-color="#7c6aef" style="background:#7c6aef"></div>
        <div class="color-swatch" data-color="#4ecdc4" style="background:#4ecdc4"></div>
        <div class="color-swatch" data-color="#e040a0" style="background:#e040a0"></div>
        <div class="color-swatch" data-color="#f39c12" style="background:#f39c12"></div>
        <div class="color-swatch" data-color="#27ae60" style="background:#27ae60"></div>
        <div class="color-swatch" data-color="#e74c3c" style="background:#e74c3c"></div>
        <div class="color-swatch" data-color="#3498db" style="background:#3498db"></div>
        <div class="color-swatch" data-color="#ecf0f1" style="background:#ecf0f1"></div>
      </div>
    </div>

    <button class="btn-reset" id="btnReset">↺ Reset to Defaults</button>

    <div class="modal-buttons" style="margin-top:16px">
      <button class="modal-btn cancel" id="settingsClose">Done</button>
    </div>
  </div>
</div>

<script src="home.js"></script>
</body>
</html>
